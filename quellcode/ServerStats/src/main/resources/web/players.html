<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spieler</title>
<!--THEME-->
<style>
:root{--bad:var(--err); --heart:#ef4b4b; --food:#c98a52; --xp:#7ed957; --armor:var(--silver); --ench:var(--amethyst)}
.block{background:var(--panel);border:2px solid var(--edge);box-shadow:var(--bevel)}
.layout{display:grid;grid-template-columns:250px 1fr;gap:20px;max-width:1180px;margin:0 auto;padding:20px 16px 40px}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.layout>*{min-width:0}
.pagehead .navlink{margin-left:auto}

/* ---------- player list ---------- */
.list{padding:10px;align-self:start;position:sticky;top:16px}
.list input{width:100%;margin-bottom:8px}
.list ul{list-style:none;margin:0;padding:0;max-height:calc(100vh - 120px);overflow:auto}
.list li button{width:100%;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;text-align:left;font:inherit;color:inherit;
  background:none;border:2px solid transparent;box-shadow:none;padding:6px;cursor:pointer}
.list li button:hover{background:var(--panel-2)}
.list li button[aria-current=true]{background:var(--sunken);border-color:var(--gold)}
.list img,.list .ph{width:30px;height:30px}
.list small{display:block;color:var(--mute);font-size:12px}
.dot{display:inline-block;width:8px;height:8px;background:var(--ok);margin-right:5px;vertical-align:1px}
@media (max-width:820px){
  .list{position:static}
  .list ul{display:flex;gap:6px;overflow-x:auto;max-height:none}
  .list li{flex:none}
  .list li button{grid-template-columns:26px auto;padding:4px 8px}
  .list li button small{display:none}
}

/* ---------- detail ---------- */
.detail{display:flex;flex-direction:column;gap:18px;min-width:0}
.who{display:flex;gap:18px;align-items:center;padding:16px 18px}
.who img,.who .ph{width:76px;height:76px;border:2px solid var(--edge)}
.who h1{font-size:clamp(26px,7vw,38px);line-height:1;overflow-wrap:anywhere}
.who .line{color:var(--mute);margin-top:6px}
.who .line b{color:var(--text);font-weight:500}
.note{padding:10px 14px;color:var(--mute);font-size:14px}

.vitals{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px;padding:16px 18px}
@media (max-width:560px){.vitals{grid-template-columns:1fr}}
.vital .lab{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin-bottom:6px}
.vital .lab b{color:var(--text);font-family:var(--px);font-size:17px;font-weight:500}
.icons{display:flex;flex-wrap:wrap;gap:3px}
.ic{position:relative;width:18px;height:18px;display:inline-block}
.ic svg{position:absolute;inset:0;width:18px;height:18px;shape-rendering:crispEdges}
.ic .fill{position:absolute;inset:0;overflow:hidden}
.ic .fill.half{right:50%}
.vital .bar{height:10px}
.vital .bar i{background:var(--xp)}
.lvl{font-family:var(--px);font-size:30px;color:var(--xp);line-height:1;margin-right:10px}

section h2{font-size:24px;margin:0 0 10px}
.gear{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:640px){.gear{grid-template-columns:1fr} .gear .hand{order:1} .gear .slot-gap{display:none}}
.slot{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:12px;align-items:start;min-height:84px}
.slot .what{font-size:12px;color:var(--mute)}
.slot .name{font-weight:700;margin:1px 0 4px;word-break:break-word}
.slot .name small{font-weight:400;color:var(--mute)}
.slot.empty .name{color:var(--mute);font-weight:400}
.ench{display:flex;flex-wrap:wrap;gap:4px 6px;margin:2px 0 6px}
.ench span{font-size:13px;color:#e3d0ff;background:rgba(185,140,245,.14);border:1px solid rgba(185,140,245,.45);padding:0 7px}
.ench span.curse{color:#ffb4ae;background:rgba(239,90,79,.14);border-color:rgba(239,90,79,.45)}
.dura{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:12px;color:var(--mute)}
.dura .bar{height:7px}
.trim{font-size:12.5px;color:var(--mute);margin-top:4px}

/* item picture: material colour + slot silhouette, enchanted items shimmer */
.pic{position:relative;width:58px;height:58px;background:var(--sunken);border:2px solid var(--edge);box-shadow:var(--sink);display:grid;place-items:center;overflow:hidden}
.pic svg{width:40px;height:40px;shape-rendering:crispEdges}
.pic .amt{position:absolute;right:3px;bottom:0;font:700 14px var(--px);text-shadow:2px 2px 0 var(--edge)}
.pic.glint::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(115deg, transparent 20%, rgba(190,120,255,.55) 40%, transparent 55%, rgba(190,120,255,.35) 75%, transparent 90%);
  background-size:300% 100%;background-position:100% 0}
@media (prefers-reduced-motion:no-preference){ .pic.glint::after{animation:glint 3.2s linear infinite} }
@keyframes glint{to{background-position:-200% 0}}

.fx{display:flex;flex-wrap:wrap;gap:8px}
.fx span{padding:6px 10px;font-size:14px}
.fx b{font-family:var(--px);font-weight:500;margin-left:6px}

.vals{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.val{padding:10px 12px}
.val b{display:block;font:500 22px var(--px)}
.val span{font-size:13px;color:var(--mute)}

.inv{padding:12px}
.grid9{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;max-width:540px}
.grid9 .hot{margin-top:8px}
.cell{aspect-ratio:1;background:var(--sunken);border:2px solid var(--edge);box-shadow:var(--sink);display:grid;place-items:center;position:relative;cursor:default;font:inherit;color:inherit;padding:0;overflow:hidden;border-radius:1px}
.cell.full{cursor:pointer}
.cell.full:hover,.cell[aria-pressed=true]{border-color:var(--gold)}
.cell svg{width:70%;height:70%;shape-rendering:crispEdges}
.cell .amt{position:absolute;right:2px;bottom:-1px;font:700 12px var(--px);text-shadow:1px 1px 0 var(--edge)}
.cell.glint::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(115deg, transparent 25%, rgba(190,120,255,.5) 45%, transparent 60%);background-size:300% 100%;background-position:100% 0}
@media (prefers-reduced-motion:no-preference){ .cell.glint::after{animation:glint 3.2s linear infinite} }
.cellinfo{margin-top:10px;min-height:22px;font-size:14px}
.cellinfo .ench{display:inline-flex;margin-left:6px}
.empty-state{padding:40px 20px;text-align:center;color:var(--mute)}
</style>
</head>
<body>
<header class="pagehead">
  <span class="mark" aria-hidden="true"></span><span class="srv" id="srvName">Server</span><span class="where">Spieler</span>
  <a class="navlink btn" href="../">Zur Statistik</a>
</header>
<div class="layout">
  <nav class="list block" aria-label="Spieler">
    <input id="search" placeholder="Spieler suchen" aria-label="Spieler suchen">
    <ul id="list"></ul>
  </nav>
  <main class="detail" id="detail" aria-live="off"></main>
</div>

<script>
if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D = { data:null, sel:null, cell:null, key:'' };
try { D.sel = localStorage.getItem('players_sel'); } catch {}

// ---------------- German names ----------------
const MAT = { netherite:'Netherit', diamond:'Diamant', iron:'Eisen', golden:'Gold', chainmail:'Ketten', leather:'Leder', copper:'Kupfer',
  stone:'Stein', wooden:'Holz', turtle:'Schildkröten' };
const PIECE = { helmet:'helm', chestplate:'brustpanzer', leggings:'hose', boots:'stiefel', sword:'schwert', pickaxe:'spitzhacke',
  axe:'axt', shovel:'schaufel', hoe:'hacke', spear:'speer', horse_armor:'-Rossharnisch' };
const ITEMS = { elytra:'Elytra', shield:'Schild', bow:'Bogen', crossbow:'Armbrust', trident:'Dreizack', mace:'Streitkolben',
  turtle_helmet:'Schildkrötenpanzer', totem_of_undying:'Totem der Unsterblichkeit', fishing_rod:'Angel', shears:'Schere',
  flint_and_steel:'Feuerzeug', carved_pumpkin:'Geschnitzter Kürbis', player_head:'Spielerkopf', wither_skeleton_skull:'Witherskelettschädel',
  enchanted_book:'Verzaubertes Buch', golden_apple:'Goldener Apfel', enchanted_golden_apple:'Verzauberter goldener Apfel',
  cooked_beef:'Steak', bread:'Brot', golden_carrot:'Goldene Karotte', torch:'Fackel', ender_pearl:'Enderperle', firework_rocket:'Feuerwerksrakete',
  arrow:'Pfeil', spectral_arrow:'Spektralpfeil', tipped_arrow:'Getränkter Pfeil', water_bucket:'Wassereimer', lava_bucket:'Lavaeimer', bucket:'Eimer',
  diamond:'Diamant', emerald:'Smaragd', iron_ingot:'Eisenbarren', gold_ingot:'Goldbarren', netherite_ingot:'Netheritbarren', coal:'Kohle',
  cobblestone:'Bruchstein', cobbled_deepslate:'Bruchtiefenschiefer', dirt:'Erde', oak_log:'Eichenstamm', oak_planks:'Eichenbretter',
  crafting_table:'Werkbank', furnace:'Ofen', chest:'Truhe', shulker_box:'Shulkerkiste', compass:'Kompass', clock:'Uhr', map:'Karte', filled_map:'Karte',
  experience_bottle:'Erfahrungsfläschchen', potion:'Trank', splash_potion:'Wurftrank', name_tag:'Namensschild', saddle:'Sattel', lead:'Leine',
  wind_charge:'Windkugel', brush:'Pinsel', spyglass:'Fernrohr', recovery_compass:'Bergungskompass', blaze_rod:'Lohenrute', nether_star:'Netherstern' };
function itemName(id){
  if (ITEMS[id]) return ITEMS[id];
  for (const [m, mg] of Object.entries(MAT)){
    if (id.startsWith(m + '_')){
      const rest = id.slice(m.length + 1);
      if (PIECE[rest]) return mg + PIECE[rest];
    }
  }
  return id.split('_').map(w => w[0].toUpperCase() + w.slice(1)).join(' ');
}
const ENCH = { protection:'Schutz', fire_protection:'Feuerschutz', feather_falling:'Federfall', blast_protection:'Explosionsschutz',
  projectile_protection:'Schusssicher', respiration:'Atmung', aqua_affinity:'Wasseraffinität', thorns:'Dornen', depth_strider:'Wasserläufer',
  frost_walker:'Eisläufer', binding_curse:'Fluch der Bindung', soul_speed:'Seelenläufer', swift_sneak:'Huschen', sharpness:'Schärfe', smite:'Bann',
  bane_of_arthropods:'Nemesis der Gliederfüßer', knockback:'Rückstoß', fire_aspect:'Verbrennung', looting:'Plünderung', sweeping_edge:'Schwungkraft',
  efficiency:'Effizienz', silk_touch:'Behutsamkeit', unbreaking:'Haltbarkeit', fortune:'Glück', power:'Stärke', punch:'Schlag', flame:'Flamme',
  infinity:'Unendlichkeit', luck_of_the_sea:'Glück des Meeres', lure:'Köder', loyalty:'Treue', impaling:'Harpune', riptide:'Sog', channeling:'Entladung',
  multishot:'Mehrfachschuss', quick_charge:'Schnellladen', piercing:'Durchschuss', mending:'Reparatur', vanishing_curse:'Fluch des Verschwindens',
  density:'Dichte', breach:'Bresche', wind_burst:'Windstoß' };
const ONE_LEVEL = new Set(['mending','silk_touch','infinity','flame','aqua_affinity','channeling','multishot','binding_curse','vanishing_curse']);
const ROMAN = ['', 'I','II','III','IV','V','VI','VII','VIII','IX','X'];
const enchText = e => (ENCH[e.id] || e.id.replace(/_/g, ' ')) + (ONE_LEVEL.has(e.id) && e.level === 1 ? '' : ' ' + (ROMAN[e.level] || e.level));
const EFFECT = { speed:'Schnelligkeit', slowness:'Langsamkeit', haste:'Eile', mining_fatigue:'Abbaulähmung', strength:'Stärke',
  instant_health:'Direktheilung', instant_damage:'Direktschaden', jump_boost:'Sprungkraft', nausea:'Übelkeit', regeneration:'Regeneration',
  resistance:'Resistenz', fire_resistance:'Feuerresistenz', water_breathing:'Unterwasseratmung', invisibility:'Unsichtbarkeit', blindness:'Blindheit',
  night_vision:'Nachtsicht', hunger:'Hunger', weakness:'Schwäche', poison:'Vergiftung', wither:'Ausdörrung', health_boost:'Extraenergie',
  absorption:'Absorption', saturation:'Sättigung', glowing:'Leuchten', levitation:'Schwebekraft', luck:'Glück', unluck:'Pech', slow_falling:'Sanfter Fall',
  conduit_power:'Meereskraft', dolphins_grace:'Gunst des Delfins', bad_omen:'Böses Omen', hero_of_the_village:'Held des Dorfes', darkness:'Dunkelheit',
  trial_omen:'Prüfungsomen', raid_omen:'Überfallomen', wind_charged:'Windgeladen', weaving:'Weben', oozing:'Schleimen', infested:'Befallen' };
const BAD_FX = new Set(['slowness','mining_fatigue','instant_damage','nausea','blindness','hunger','weakness','poison','wither','levitation','unluck','bad_omen','darkness','infested']);
const TRIM_MAT = { quartz:'Quarz', iron:'Eisen', netherite:'Netherit', redstone:'Redstone', copper:'Kupfer', gold:'Gold', emerald:'Smaragd',
  diamond:'Diamant', lapis:'Lapislazuli', amethyst:'Amethyst', resin:'Harz' };
const TRIM_PAT = { rib:'Rippe', silence:'Stille', sentry:'Wache', dune:'Düne', coast:'Küste', wild:'Wildnis', ward:'Wärter', eye:'Auge',
  vex:'Plagegeist', tide:'Gezeiten', snout:'Schnauze', spire:'Turmspitze', wayfinder:'Wegfinder', raiser:'Heber', shaper:'Former',
  host:'Gastgeber', flow:'Fluss', bolt:'Bolzen' };
const cap = t => t ? t[0].toUpperCase() + t.slice(1) : t;
const CAUSE = { LAVA:'in Lava', FALL:'durch einen Sturz', VOID:'im Void', DROWNING:'ertrunken', ENTITY_EXPLOSION:'durch eine Explosion',
  BLOCK_EXPLOSION:'durch eine Explosion', FIRE:'verbrannt', FIRE_TICK:'verbrannt', SUFFOCATION:'erstickt', STARVATION:'verhungert',
  FLY_INTO_WALL:'gegen eine Wand geflogen', ENTITY_ATTACK:'erledigt', PROJECTILE:'abgeschossen', MAGIC:'durch Magie', POISON:'vergiftet',
  WITHER:'verwelkt', FREEZE:'erfroren', LIGHTNING:'vom Blitz getroffen', HOT_FLOOR:'auf Magma', CONTACT:'an einem Kaktus', PVP:'im PvP' };
const GM = { survival:'Survival', creative:'Creative', adventure:'Abenteuer', spectator:'Zuschauer' };

// ---------------- pictures ----------------
const COLORS = { emerald:'#3ccf6e', lapis:'#3f6fd8', redstone:'#d83c3c', amethyst:'#a77be0', totem:'#f0d36a', netherite:'#4d4246', diamond:'#5fe0da', iron:'#d9dde2', golden:'#f5c84c', gold:'#f5c84c', chainmail:'#8d949e', leather:'#9a6640',
  copper:'#d0814f', turtle:'#55b062', wooden:'#a8804e', stone:'#8b8f96', elytra:'#a596d4', shield:'#9a7446', bow:'#9a7446', crossbow:'#8a6a40',
  trident:'#4fb3a8', mace:'#7b7f8c' };
function colorOf(id){
  for (const k of Object.keys(COLORS)) if (id === k || id.startsWith(k + '_') || id.endsWith('_' + k) || id.includes(k)) return COLORS[k];
  let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0;   // stable colour for everything else
  return `hsl(${h % 360} 35% 55%)`;
}
// blocky silhouettes on a 16×16 grid
const SHAPES = {
  head:'M3 3h10v2h1v6h-3v-3H5v3H2V5h1z',
  chest:'M2 2h4v2h4V2h4v5h-2v7H4V7H2z',
  legs:'M3 2h10v12h-4V7H7v7H3z',
  feet:'M2 6h4v4h-4zM10 6h4v4h-4zM1 10h6v3H1zM9 10h6v3H9z',
  sword:'M12 1h3v3l-7 7 2 2-2 2-2-2-3 3-2-2 3-3-2-2 2-2 2 2z',
  tool:'M2 2h9v3H8v9H5V5H2z',
  shield:'M3 1h10v7l-5 7-5-7z',
  wings:'M1 2h5l2 3 2-3h5l-2 12h-3l-2-6-2 6H3z',
  bow:'M3 1h3l7 7-7 7H3l6-7z',
  block:'M2 2h12v12H2z',
  orb:'M5 2h6v2h2v2h1v4h-1v2h-2v2H5v-2H3v-2H2V6h1V4h2z'
};
function shapeFor(id, slot){
  if (/helmet|_head$|skull|pumpkin/.test(id)) return 'head';
  if (/chestplate|elytra/.test(id)) return id === 'elytra' ? 'wings' : 'chest';
  if (/leggings/.test(id)) return 'legs';
  if (/boots/.test(id)) return 'feet';
  if (/sword|spear|mace|trident/.test(id)) return 'sword';
  if (/pickaxe|_axe|shovel|_hoe/.test(id)) return 'tool';
  if (id === 'shield') return 'shield';
  if (/bow/.test(id)) return 'bow';
  if (/pearl|eye|apple|totem|ball|charge|star|orb|bottle|potion/.test(id)) return 'orb';
  return SHAPES[slot] ? slot : 'block';
}
function svgFor(id, slot, empty){
  const s = shapeFor(id || '', slot);
  const fill = empty ? 'rgba(0,0,0,.18)' : colorOf(id);
  return `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="${SHAPES[s]}" fill="${fill}"/>${empty ? '' : `<path d="${SHAPES[s]}" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="1"/>`}</svg>`;
}

// ---------------- vitals icons ----------------
const HEART = 'M2 2h4v1h1v1h2V3h1V2h4v1h1v5h-1v1h-1v1h-1v1h-1v1h-1v1H8v-1H7v-1H6v-1H5v-1H4V9H3V8H2V3z';
const DRUM = 'M9 1h4v1h1v1h1v4h-1v1h-1v1h-3l-4 4v2H4v-1H3v-1H1v-2h2l4-4V4h1V2h1z';
const PLATE = 'M2 2h4v2h4V2h4v5h-2v7H4V7H2z';
function icons(path, value, max, color){
  let html = '';
  const n = Math.ceil(max / 2);
  for (let i = 0; i < n; i++){
    const v = value - i * 2;
    const cls = v >= 2 ? 'fill' : v >= 1 ? 'fill half' : '';
    html += `<span class="ic"><svg viewBox="0 0 16 16"><path d="${path}" fill="rgba(0,0,0,.35)"/></svg>${cls ? `<span class="${cls}"><svg viewBox="0 0 16 16"><path d="${path}" fill="${color}"/></svg></span>` : ''}</span>`;
  }
  return html;
}

// ---------------- helpers ----------------
function head(p, size){
  if (!p?.uuid) return `<span class="ph" style="width:${size}px;height:${size}px">${esc((p?.name || '?')[0])}</span>`;
  return `<img class="head" alt="" width="${size}" height="${size}" loading="lazy" src="https://mc-heads.net/avatar/${esc(p.uuid)}/${size * 2}"
    onerror="this.outerHTML='<span class=&quot;ph&quot; style=&quot;width:${size}px;height:${size}px&quot;>${esc((p?.name || '?')[0]).replace(/'/g, '')}</span>'">`;
}
const ago = ts => { const s = (Date.now() - ts) / 1000;
  if (s < 90) return 'gerade eben'; if (s < 3600) return `vor ${Math.round(s / 60)} Min.`;
  if (s < 86400) return `vor ${Math.round(s / 3600)} Std.`; if (s < 86400 * 30) return `vor ${Math.round(s / 86400)} Tagen`;
  return new Date(ts).toLocaleDateString('de-DE'); };
const dur = ms => { let m = Math.floor(ms / 60000); const h = Math.floor(m / 60); m %= 60; return h ? `${h} Std ${m} Min` : `${m} Min`; };
const mmss = s => s < 0 ? '∞' : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const num = (v, d = 0) => Number(v || 0).toLocaleString('de-DE', { minimumFractionDigits:d, maximumFractionDigits:d });

function itemDetails(it){
  let h = '';
  if (it.enchants?.length) h += '<div class="ench">' + it.enchants.map(e => `<span class="${e.id.endsWith('_curse') ? 'curse' : ''}">${esc(enchText(e))}</span>`).join('') + '</div>';
  if (it.unbreakable) h += '<div class="dura">Unzerstörbar</div>';
  else if (it.maxDamage){
    const left = it.maxDamage - (it.damage || 0), pct = left / it.maxDamage * 100;
    const col = pct > 50 ? 'var(--ok)' : pct > 20 ? 'var(--warn)' : 'var(--bad)';
    h += `<div class="dura"><span class="bar"><i style="width:${Math.max(1, pct)}%;background:${col}"></i></span><span>${num(left)} / ${num(it.maxDamage)}</span></div>`;
  }
  if (it.trim) h += `<div class="trim">Verzierung: ${esc(TRIM_PAT[it.trim.pattern] || it.trim.pattern.replace(/_/g, ' '))} aus ${esc(TRIM_MAT[it.trim.material] || it.trim.material)}</div>`;
  return h;
}
function slotCard(label, slot, it){
  const hand = slot === 'sword' || slot === 'shield' ? ' hand' : '';
  if (!it) return `<div class="slot block empty${hand}"><div class="pic">${svgFor('', slot, true)}</div><div><div class="what">${label}</div><div class="name">leer</div></div></div>`;
  return `<div class="slot block${hand}"><div class="pic ${it.enchants?.length ? 'glint' : ''}">${svgFor(it.id, slot)}${it.amount > 1 ? `<span class="amt">${it.amount}</span>` : ''}</div>
    <div><div class="what">${label}</div>
    <div class="name">${esc(it.name || itemName(it.id))}${it.name ? ` <small>${esc(itemName(it.id))}</small>` : ''}</div>${itemDetails(it)}</div></div>`;
}
function grid(items, from, to, hotbarFirst){
  let h = '';
  for (let i = from; i < to; i++){
    const it = items[i];
    h += it
      ? `<button class="cell full ${it.enchants?.length ? 'glint' : ''}" data-i="${i}" title="${esc((it.name || itemName(it.id)) + (it.amount > 1 ? ' ×' + it.amount : ''))}" aria-label="${esc(it.name || itemName(it.id))}">${svgFor(it.id, 'block')}${it.amount > 1 ? `<span class="amt">${it.amount}</span>` : ''}</button>`
      : `<span class="cell" aria-hidden="true"></span>`;
  }
  return h;
}

// ---------------- render ----------------
function renderList(){
  const q = $('#search').value.trim().toLowerCase();
  const ps = D.data.players.filter(p => !q || p.name.toLowerCase().includes(q))
    .sort((a, b) => (b.online - a.online) || ((b.lastSeen || 0) - (a.lastSeen || 0)) || a.name.localeCompare(b.name));
  $('#list').innerHTML = ps.map(p => `<li><button data-u="${esc(p.uuid)}" aria-current="${p.uuid === D.sel}">${head(p, 30)}
      <span>${esc(p.name)}<small>${p.online ? '<span class="dot"></span>online' : 'zuletzt ' + ago(p.lastSeen)}</small></span></button></li>`).join('')
    || '<li class="muted" style="padding:8px">Niemand gefunden.</li>';
}

function renderDetail(){
  const p = D.data.players.find(x => x.uuid === D.sel);
  const box = $('#detail');
  if (!p){ box.innerHTML = '<div class="block empty-state">Noch keine Spielerdaten. Sobald jemand online ist, erscheint er hier.</div>'; return; }
  const v = p.vitals || {}, st = p.stats || {}, eq = p.equipment || {};
  let h = '';
  // --- who
  const status = p.online
    ? `<span class="dot"></span><b>online</b> seit ${dur(Date.now() - p.since)} · ${esc(GM[p.gm] || p.gm)} · ${num(p.ping)} ms Ping`
    : `zuletzt online <b>${ago(p.lastSeen)}</b>`;
  const loc = p.loc ? `<div class="line">${esc(p.loc.world)} · <b>${num(p.loc.x)} ${num(p.loc.y)} ${num(p.loc.z)}</b></div>` : '';
  h += `<div class="who block">${head(p, 76)}<div><h1>${esc(p.name)}</h1><div class="line">${status}</div>${loc}</div></div>`;
  if (!p.online) h += `<div class="note block">Das ist der Stand beim letzten Ausloggen.</div>`;

  // --- vitals
  const absorb = v.absorption > 0 ? `<span class="icons" style="margin-top:3px">${icons(HEART, v.absorption, v.absorption, 'var(--gold)')}</span>` : '';
  h += `<div class="vitals block">
    <div class="vital"><div class="lab">Leben <b>${num(v.health, 1)} / ${num(v.maxHealth)}${v.absorption > 0 ? ' + ' + num(v.absorption, 1) : ''}</b></div>
      <div class="icons">${icons(HEART, v.health, v.maxHealth, 'var(--heart)')}</div>${absorb}</div>
    <div class="vital"><div class="lab">Hunger <b>${num(v.food)} / 20 <span class="muted" style="font:400 13px var(--sans)">Sättigung ${num(v.saturation, 1)}</span></b></div>
      <div class="icons">${icons(DRUM, v.food, 20, 'var(--food)')}</div></div>
    <div class="vital"><div class="lab">Erfahrung <b>${Math.round((v.exp || 0) * 100)} % bis Level ${num((v.level || 0) + 1)}</b></div>
      <div style="display:flex;align-items:center"><span class="lvl">${num(v.level)}</span><span class="bar" style="flex:1"><i style="width:${(v.exp || 0) * 100}%"></i></span></div></div>
    <div class="vital"><div class="lab">Rüstung <b>${num(v.armor)}${v.toughness ? ' · Härte ' + num(v.toughness) : ''}</b></div>
      <div class="icons">${icons(PLATE, v.armor, 20, 'var(--armor)')}</div></div>
  </div>`;

  // --- equipment
  h += `<section><h2>Ausrüstung</h2><div class="gear">
    ${slotCard('Kopf', 'head', eq.head)}${slotCard('Haupthand', 'sword', eq.mainhand)}
    ${slotCard('Brust', 'chest', eq.chest)}${slotCard('Zweithand', 'shield', eq.offhand)}
    ${slotCard('Beine', 'legs', eq.legs)}<div class="slot-gap" aria-hidden="true"></div>
    ${slotCard('Füße', 'feet', eq.feet)}
  </div></section>`;

  // --- effects
  if (p.online){
    h += `<section><h2>Effekte</h2>` + (p.effects?.length
      ? `<div class="fx">${p.effects.map(e => `<span class="block" style="${BAD_FX.has(e.id) ? 'color:#ffb4ae' : ''}">${esc(EFFECT[e.id] || e.id.replace(/_/g, ' '))}${e.level > 1 ? ' ' + (ROMAN[e.level] || e.level) : ''}<b>${mmss(e.seconds)}</b></span>`).join('')}</div>`
      : `<p class="muted" style="margin:0">Gerade keine Tränke oder Effekte aktiv.</p>`) + `</section>`;
  }

  // --- numbers
  const ld = p.lastDeath;
  const vals = [
    [num(st.playtime, 1) + ' h', 'Spielzeit gesamt'],
    [num(st.deaths), 'Tode'],
    [ld ? ago(ld.ts) : '–', ld ? 'zuletzt gestorben, ' + (ld.by ? 'von ' + cap(ld.by.replace(/_/g, ' ')) + ' ' : '') + (CAUSE[ld.cause] || ld.cause.toLowerCase()) : 'noch nicht gestorben (seit Aufzeichnung)'],
    [num(st.life, 1) + ' h', 'überlebt seit dem letzten Tod'],
    [num(st.mob_kills), 'Mobs getötet'],
    [num(st.diamonds), 'Diamanterz abgebaut'],
    [num(st.walked, 1) + ' km', 'zu Fuß unterwegs'],
  ];
  h += `<section><h2>Werte</h2><div class="vals">${vals.map(([b, s]) => `<div class="val block"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join('')}</div></section>`;

  // --- inventory
  if (p.inventory){
    h += `<section><h2>Inventar</h2><div class="inv block">
      <div class="grid9" data-src="inventory">${grid(p.inventory, 9, 36)}</div>
      <div class="grid9" data-src="inventory" style="margin-top:8px">${grid(p.inventory, 0, 9)}</div>
      <div class="cellinfo" id="info-inventory"><span class="muted">Auf ein Feld klicken für Details. Die untere Reihe ist die Schnellleiste.</span></div></div></section>`;
    h += `<section><h2>Endertruhe</h2><div class="inv block">
      <div class="grid9" data-src="enderchest">${grid(p.enderchest || [], 0, 27)}</div>
      <div class="cellinfo" id="info-enderchest"></div></div></section>`;
  } else if (!D.data.showInventory){
    h += `<p class="muted" style="margin:0">Inventar und Endertruhe sehen nur Admins.</p>`;
  }
  box.innerHTML = h;
  if (D.cell) showCell(D.cell.src, D.cell.i);
}

function showCell(src, i){
  const p = D.data.players.find(x => x.uuid === D.sel); const it = p?.[src]?.[i];
  const info = document.getElementById('info-' + src); if (!info) return;
  document.querySelectorAll('.cell[aria-pressed]').forEach(c => c.removeAttribute('aria-pressed'));
  if (!it){ D.cell = null; return; }
  D.cell = { src, i };
  document.querySelector(`.grid9[data-src="${src}"] .cell[data-i="${i}"]`)?.setAttribute('aria-pressed', 'true');
  info.innerHTML = `<b>${esc(it.name || itemName(it.id))}</b>${it.amount > 1 ? ' ×' + it.amount : ''}${it.name ? ` <span class="muted">${esc(itemName(it.id))}</span>` : ''}` + itemDetails(it);
}

async function load(){
  try {
    const r = await fetch('api/players', { cache:'no-store' });
    const d = await r.json();
    const key = JSON.stringify(d.players);
    D.data = d;
    if (d.serverName){ $('#srvName').textContent = d.serverName; document.title = d.serverName + ' – Spieler'; }
    if (!D.sel || !d.players.some(p => p.uuid === D.sel)){
      const first = [...d.players].sort((a, b) => (b.online - a.online) || ((b.lastSeen || 0) - (a.lastSeen || 0)))[0];
      D.sel = first?.uuid || null;
    }
    renderList();
    if (key !== D.key){ D.key = key; renderDetail(); }     // don't rebuild the page when nothing changed
  } catch(e){ /* server briefly unreachable – try again next round */ }
}
$('#list').addEventListener('click', e => {
  const b = e.target.closest('button[data-u]'); if (!b) return;
  D.sel = b.dataset.u; D.cell = null;
  try { localStorage.setItem('players_sel', D.sel); } catch {}
  renderList(); renderDetail(); window.scrollTo({ top:0 });
});
$('#detail').addEventListener('click', e => {
  const c = e.target.closest('.cell.full'); if (!c) return;
  showCell(c.closest('.grid9').dataset.src, +c.dataset.i);
});
$('#search').addEventListener('input', renderList);
load(); setInterval(load, 3000);
</script>
</body>
</html>
